[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-world-model-planning"
version = "0.1.1"
description = "Subgoal-conditioned action generation for latent world-model planning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = [
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "numpy>=2.2,<2.3",
  "stable-pretraining==0.1.7",
  "gymnasium>=1.3,<1.4",
  "ogbench==1.2.1",
  "lancedb>=0.33,<0.34",
  "pylance>=7,<8",
  "pyarrow>=24,<25",
  "h5py>=3.16,<3.17",
  "einops>=0.8,<0.9",
  "transformers>=5.1,<5.2",
  "huggingface-hub>=0.36",
  "opencv-python-headless>=4.13,<4.14",
  "pygame>=2.6,<2.7",
  "pymunk>=6.8,<6.9",
  "shapely>=2.1,<2.2",
  "pillow",
  "tqdm",
  "rich",
  "loguru",
  "tabulate",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["sage*", "stable_worldmodel*"]

[tool.ruff]
line-length = 88
target-version = "py310"
